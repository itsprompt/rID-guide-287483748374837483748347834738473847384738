PRIME PILLAR
RESIDENT GUIDE

================================

WELCOME / ยินดีต้อนรับ / ကြိုဆိုပါသည်

English:
Welcome to Prime Pillar! This guide
provides important information to
help residents enjoy a comfortable,
safe, and convenient living experience.

ภาษาไทย:
ยินดีต้อนรับสู่ Prime Pillar!
คู่มือนี้จัดทำขึ้นเพื่อให้ข้อมูลสำคัญ
แก่ผู้พักอาศัย เพื่อความสะดวกสบาย
ความปลอดภัย และการอยู่อาศัยร่วมกัน
อย่างมีความสุข

မြန်မာဘာသာ:
Prime Pillar မှ ကြိုဆိုပါသည်။
ဤလမ်းညွှန်တွင် နေထိုင်သူများ
သက်သောင့်သက်သာ၊ လုံခြုံစိတ်ချစွာနှင့်
အဆင်ပြေစွာ နေထိုင်နိုင်ရန်
အရေးကြီးသော အချက်အလက်များကို
ဖော်ပြထားပါသည်။

================================

1. BUILDING RULES
กฎระเบียบอาคาร
အဆောက်အအုံ စည်းကမ်းများ

English:
- Keep shared areas clean and tidy.
- Avoid excessive noise, especially
  at night.
- Respect other residents and staff.
- Do not damage building property.
- Follow building safety instructions.

ภาษาไทย:
- รักษาความสะอาดในพื้นที่ส่วนกลาง
- หลีกเลี่ยงการส่งเสียงดัง
  โดยเฉพาะในเวลากลางคืน
- เคารพผู้พักอาศัยและเจ้าหน้าที่
- ห้ามทำลายทรัพย์สินของอาคาร
- ปฏิบัติตามคำแนะนำด้านความปลอดภัย

မြန်မာဘာသာ:
- အများသုံးနေရာများကို
  သန့်ရှင်းသပ်ရပ်စွာ ထားရှိပါ။
- ညအချိန်တွင် ဆူညံသံများ
  မဖြစ်စေရန် ဂရုစိုက်ပါ။
- အခြားနေထိုင်သူများနှင့်
  ဝန်ထမ်းများကို လေးစားပါ။
- အဆောက်အအုံပစ္စည်းများကို
  မဖျက်ဆီးပါနှင့်။
- ဘေးကင်းရေးညွှန်ကြားချက်များကို
  လိုက်နာပါ။

================================

2. CLEANLINESS & WASTE
ความสะอาดและการทิ้งขยะ
သန့်ရှင်းရေးနှင့် အမှိုက်စွန့်ပစ်ခြင်း

English:
Dispose of rubbish in designated bins.
Do not leave rubbish in hallways,
staircases, or shared spaces.

ภาษาไทย:
กรุณาทิ้งขยะในถังขยะที่จัดเตรียมไว้
ห้ามวางขยะบริเวณทางเดิน บันได
หรือพื้นที่ส่วนกลาง

မြန်မာဘာသာ:
အမှိုက်များကို သတ်မှတ်ထားသော
အမှိုက်ပုံးများတွင်သာ စွန့်ပစ်ပါ။
အများသုံးနေရာများတွင်
အမှိုက်များ မထားခဲ့ပါနှင့်။

================================

3. SAFETY & SECURITY
ความปลอดภัย
လုံခြုံရေး

English:
- Lock your room when leaving.
- Do not allow unknown individuals
  into restricted areas.
- Report suspicious activity.
- Keep emergency exits clear.
- Follow evacuation instructions.

ภาษาไทย:
- ล็อกประตูห้องทุกครั้งเมื่อออกจากห้อง
- ไม่อนุญาตให้บุคคลที่ไม่รู้จัก
  เข้าพื้นที่จำกัด
- แจ้งเหตุการณ์น่าสงสัย
- ห้ามกีดขวางทางหนีไฟ
- ปฏิบัติตามคำแนะนำในการอพยพ

မြန်မာဘာသာ:
- အခန်းမှ ထွက်ခွာသည့်အခါ
  တံခါးကို သော့ခတ်ပါ။
- မသိသောသူများကို
  ဝင်ခွင့်ကန့်သတ်ထားသော
  နေရာများသို့ ဝင်ခွင့်မပြုပါနှင့်။
- သံသယဖြစ်ဖွယ် အခြေအနေများကို
  အကြောင်းကြားပါ။
- အရေးပေါ်ထွက်ပေါက်များကို
  ပိတ်ဆို့မထားပါနှင့်။
- ဘေးလွတ်ရာသို့ ရွှေ့ပြောင်းရန်
  ညွှန်ကြားချက်များကို လိုက်နာပါ။

================================

4. MAINTENANCE & REPAIRS
การแจ้งซ่อม
ပြုပြင်ထိန်းသိမ်းရေး

English:
If you experience problems with
electricity, water, air conditioning,
or other room facilities, contact
building management.

Provide your room number and
describe the problem clearly.

ภาษาไทย:
หากพบปัญหาเกี่ยวกับไฟฟ้า
น้ำประปา เครื่องปรับอากาศ
หรืออุปกรณ์ภายในห้องพัก
กรุณาติดต่อฝ่ายจัดการอาคาร

พร้อมแจ้งหมายเลขห้องพัก
และรายละเอียดปัญหา

မြန်မာဘာသာ:
လျှပ်စစ်၊ ရေ၊ လေအေးပေးစက်
သို့မဟုတ် အခန်းတွင်းပစ္စည်းများတွင်
ပြဿနာရှိပါက အဆောက်အအုံ
စီမံခန့်ခွဲရေးထံ ဆက်သွယ်ပါ။

အခန်းနံပါတ်နှင့် ပြဿနာအကြောင်း
ရှင်းလင်းစွာ ဖော်ပြပေးပါ။

================================

5. ANNOUNCEMENTS
ประกาศข่าวสาร
ကြေညာချက်များ

English:
Check official Prime Pillar
announcements regularly for
maintenance schedules, service
interruptions, and important updates.

ภาษาไทย:
กรุณาติดตามประกาศอย่างเป็นทางการ
ของ Prime Pillar อย่างสม่ำเสมอ
เพื่อรับทราบข่าวสารและข้อมูลสำคัญ

မြန်မာဘာသာ:
Prime Pillar ၏ တရားဝင်
ကြေညာချက်များကို ပုံမှန်စစ်ဆေးပါ။
ပြုပြင်ထိန်းသိမ်းရေးအစီအစဉ်များနှင့်
အရေးကြီးသတင်းများကို သိရှိနိုင်ပါသည်။

================================

6. CONTACT & ASSISTANCE
ติดต่อและขอความช่วยเหลือ
ဆက်သွယ်ရန်နှင့် အကူအညီတောင်းခံရန်

Building Management
ฝ่ายจัดการอาคาร
အဆောက်အအုံစီမံခန့်ခွဲရေး

Maintenance
แจ้งซ่อม
ပြုပြင်ရေး

General Enquiries
สอบถามข้อมูลทั่วไป
အထွေထွေစုံစမ်းမေးမြန်းရန်

Emergency Assistance
ความช่วยเหลือฉุกเฉิน
အရေးပေါ်အကူအညီ

Contact details and operating hours
will be provided by building management.

================================

THANK YOU FOR CHOOSING PRIME PILLAR

ขอบคุณที่เลือกพักอาศัยกับ Prime Pillar

Prime Pillar တွင် နေထိုင်ရန်
ရွေးချယ်ပေးသည့်အတွက်
ကျေးဇူးတင်ပါသည်။

================================
