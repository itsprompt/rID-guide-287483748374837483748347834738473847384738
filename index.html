  PRIME PILLAR
Resident Guide | คู่มือสำหรับผู้พักอาศัย | နေထိုင်သူများအတွက် လမ်းညွှန်

Welcome to Prime Pillar! This guide provides important information to help residents enjoy a comfortable, safe, and convenient living experience.

ยินดีต้อนรับสู่ Prime Pillar! คู่มือนี้จัดทำขึ้นเพื่อให้ข้อมูลสำคัญแก่ผู้พักอาศัย เพื่อความสะดวกสบาย ความปลอดภัย และการอยู่อาศัยร่วมกันอย่างมีความสุข

Prime Pillar မှ ကြိုဆိုပါသည်။ ဤလမ်းညွှန်တွင် နေထိုင်သူများ သက်သောင့်သက်သာ၊ လုံခြုံစိတ်ချစွာနှင့် အဆင်ပြေစွာ နေထိုင်နိုင်ရန် အရေးကြီးသော အချက်အလက်များကို ဖော်ပြထားပါသည်။

1. Building Rules | กฎระเบียบอาคาร | အဆောက်အအုံ စည်းကမ်းများ
English
- Keep shared areas clean and tidy.
- Avoid excessive noise, especially at night.
- Respect other residents and building staff.
- Do not damage building facilities or property.
- Follow all posted building notices and safety instructions.
ภาษาไทย
- รักษาความสะอาดและความเป็นระเบียบเรียบร้อยในพื้นที่ส่วนกลาง
- หลีกเลี่ยงการส่งเสียงดัง โดยเฉพาะในเวลากลางคืน
- เคารพสิทธิของผู้พักอาศัยท่านอื่นและเจ้าหน้าที่อาคาร
- ห้ามทำลายทรัพย์สินและสิ่งอำนวยความสะดวกของอาคาร
- ปฏิบัติตามประกาศและคำแนะนำด้านความปลอดภัยของอาคาร
မြန်မာဘာသာ
- အများသုံးနေရာများကို သန့်ရှင်းသပ်ရပ်စွာ ထားရှိပါ။
- အထူးသဖြင့် ညအချိန်တွင် ဆူညံသံများ မဖြစ်စေရန် ဂရုစိုက်ပါ။
- အခြားနေထိုင်သူများနှင့် အဆောက်အအုံဝန်ထမ်းများကို လေးစားပါ။
- အဆောက်အအုံ၏ ပစ္စည်းများနှင့် အဆောက်အအုံဆိုင်ရာ အထောက်အကူပစ္စည်းများကို မဖျက်ဆီးပါနှင့်။
- အဆောက်အအုံတွင် ထုတ်ပြန်ထားသော ကြေညာချက်များနှင့် ဘေးကင်းရေးညွှန်ကြားချက်များကို လိုက်နာပါ။

2. Cleanliness & Waste | ความสะอาดและการทิ้งขยะ | သန့်ရှင်းရေးနှင့် အမှိုက်စွန့်ပစ်ခြင်း
English

Please dispose of rubbish in designated bins. Do not leave rubbish in hallways, staircases, or other shared spaces. Help keep Prime Pillar clean for everyone.

ภาษาไทย

กรุณาทิ้งขยะในถังขยะที่จัดเตรียมไว้ ห้ามวางขยะบริเวณทางเดิน บันได หรือพื้นที่ส่วนกลางอื่น ๆ เพื่อช่วยกันรักษาความสะอาดของ Prime Pillar

မြန်မာဘာသာ

အမှိုက်များကို သတ်မှတ်ထားသော အမှိုက်ပုံးများတွင်သာ စွန့်ပစ်ပါ။ စင်္ကြံများ၊ လှေကားများနှင့် အများသုံးနေရာများတွင် အမှိုက်များ မထားခဲ့ပါနှင့်။ Prime Pillar ကို အားလုံးအတွက် သန့်ရှင်းစွာ ထိန်းသိမ်းပေးပါ။

3. Safety & Security | ความปลอดภัย | လုံခြုံရေး
English
- Keep your room locked when leaving.
- Do not allow unknown individuals to enter restricted areas.
- Report suspicious activity to building management.
- Keep emergency exits and stairways clear.
- In an emergency, follow evacuation instructions.
ภาษาไทย
- ล็อกประตูห้องทุกครั้งเมื่อออกจากห้อง
- ไม่อนุญาตให้บุคคลที่ไม่รู้จักเข้าพื้นที่ที่จำกัดการเข้าออก
- แจ้งฝ่ายจัดการอาคารเมื่อพบเหตุการณ์น่าสงสัย
- ห้ามวางสิ่งของกีดขวางทางหนีไฟและบันได
- เมื่อเกิดเหตุฉุกเฉิน ให้ปฏิบัติตามคำแนะนำในการอพยพ
မြန်မာဘာသာ
- အခန်းမှ ထွက်ခွာသည့်အခါတိုင်း တံခါးကို သော့ခတ်ပါ။
- မသိသောသူများကို ဝင်ခွင့်ကန့်သတ်ထားသော နေရာများသို့ ဝင်ရောက်ခွင့်မပြုပါနှင့်။
- သံသယဖြစ်ဖွယ် အခြေအနေများကို အဆောက်အအုံစီမံခန့်ခွဲရေးထံ အကြောင်းကြားပါ။
- အရေးပေါ်ထွက်ပေါက်များနှင့် လှေကားများကို ပိတ်ဆို့မထားပါနှင့်။
- အရေးပေါ်အခြေအနေတွင် ဘေးလွတ်ရာသို့ ရွှေ့ပြောင်းရန် ညွှန်ကြားချက်များကို လိုက်နာပါ။

4. Maintenance & Repairs | การแจ้งซ่อม | ပြုပြင်ထိန်းသိမ်းရေး
English

If you experience problems with electricity, water, air conditioning, or other room facilities, please contact building management. Describe the problem clearly and provide your room number.

ภาษาไทย

หากพบปัญหาเกี่ยวกับไฟฟ้า น้ำประปา เครื่องปรับอากาศ หรืออุปกรณ์ภายในห้องพัก กรุณาติดต่อฝ่ายจัดการอาคาร พร้อมแจ้งรายละเอียดปัญหาและหมายเลขห้องพัก

မြန်မာဘာသာ

လျှပ်စစ်၊ ရေ၊ လေအေးပေးစက် သို့မဟုတ် အခန်းတွင်းပစ္စည်းများတွင် ပြဿနာရှိပါက အဆောက်အအုံစီမံခန့်ခွဲရေးထံ ဆက်သွယ်ပါ။ ပြဿနာအကြောင်းအရာနှင့် အခန်းနံပါတ်ကို ရှင်းလင်းစွာ ဖော်ပြပေးပါ။

5. Announcements | ประกาศข่าวสาร | ကြေညာချက်များ
English

Residents are encouraged to check official Prime Pillar announcements regularly for maintenance schedules, service interruptions, building updates, and important notices.

ภาษาไทย

ขอความร่วมมือผู้พักอาศัยติดตามประกาศอย่างเป็นทางการของ Prime Pillar อย่างสม่ำเสมอ เพื่อรับทราบกำหนดการซ่อมบำรุง การหยุดให้บริการชั่วคราว ข่าวสารอาคาร และข้อมูลสำคัญต่าง ๆ

မြန်မာဘာသာ

နေထိုင်သူများအနေဖြင့် ပြုပြင်ထိန်းသိမ်းရေးအစီအစဉ်များ၊ ဝန်ဆောင်မှုယာယီရပ်ဆိုင်းမှုများ၊ အဆောက်အအုံဆိုင်ရာ သတင်းများနှင့် အရေးကြီးကြေညာချက်များကို သိရှိနိုင်ရန် Prime Pillar ၏ တရားဝင်ကြေညာချက်များကို ပုံမှန်စစ်ဆေးပေးပါ။
